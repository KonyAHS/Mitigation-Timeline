[project]
name = "mitigation-timeline"
dynamic = ["version"]
description = "Always-on-top FFXIV overlay that counts down to each mechanic and tells you which mitigation to press."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["keyboard>=0.13.5"]
keywords = ["ffxiv", "overlay", "raid", "mitigation", "timeline"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/KonyAHS/Mitigation-Timeline"
Releases = "https://github.com/KonyAHS/Mitigation-Timeline/releases"

[project.gui-scripts]
mitigation-overlay = "mitigation_timeline.overlay:main"
mitigation-designer = "mitigation_timeline.designer:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
build = ["pyinstaller>=6.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/mitigation_timeline/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mitigation_timeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
