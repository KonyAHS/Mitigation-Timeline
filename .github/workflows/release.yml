name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Check tag matches package version
        shell: bash
        run: |
          version=$(uv run --no-project python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('src/mitigation_timeline/__init__.py').read())[1])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME != v$version"; exit 1; }

      - run: uv sync --group dev --group build
      - run: uv run pytest -q
      - run: uv run python scripts/build.py

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/exe/*.exe \
            --title "Mitigation Timeline $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
