<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Mitigation Timeline</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232a3b"/>
      <stop offset="1" stop-color="#0e1118"/>
    </linearGradient>
    <linearGradient id="shield" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- shield = mitigation -->
  <path d="M128 30 L204 58 V120 C204 170 172 206 128 226 C84 206 52 170 52 120 V58 Z" fill="url(#shield)"/>
  <!-- clock face = timeline -->
  <circle cx="128" cy="122" r="52" fill="#11141b"/>
  <circle cx="128" cy="122" r="38" fill="none" stroke="#252d40" stroke-width="10"/>
  <path d="M128 84 A38 38 0 1 1 90 122" fill="none" stroke="#5eead4" stroke-width="10" stroke-linecap="round"/>
  <path d="M128 100 V122 L144 132" fill="none" stroke="#e6e9ef" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
